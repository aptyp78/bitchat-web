<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5c4"/>
      <stop offset="100%" style="stop-color:#00a080"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Mesh сетка (декоративная) -->
  <g stroke="#00d4aa" stroke-width="1" opacity="0.2">
    <line x1="128" y1="128" x2="384" y2="128"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
    <line x1="128" y1="384" x2="384" y2="384"/>
    <line x1="128" y1="128" x2="128" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="384" y1="128" x2="384" y2="384"/>
  </g>

  <!-- Центральный узел (большой) -->
  <circle cx="256" cy="256" r="60" fill="url(#accent)"/>

  <!-- Узлы mesh-сети -->
  <circle cx="128" cy="128" r="30" fill="#00d4aa"/>
  <circle cx="384" cy="128" r="30" fill="#00d4aa"/>
  <circle cx="128" cy="384" r="30" fill="#00d4aa"/>
  <circle cx="384" cy="384" r="30" fill="#00d4aa"/>

  <!-- Связи между узлами -->
  <g stroke="url(#accent)" stroke-width="4" opacity="0.8">
    <line x1="158" y1="158" x2="226" y2="226"/>
    <line x1="354" y1="158" x2="286" y2="226"/>
    <line x1="158" y1="354" x2="226" y2="286"/>
    <line x1="354" y1="354" x2="286" y2="286"/>
  </g>

  <!-- Символ чата в центре -->
  <g fill="#0a0a0f">
    <rect x="230" y="235" width="52" height="42" rx="8"/>
    <polygon points="240,277 256,295 272,277"/>
  </g>
</svg>
